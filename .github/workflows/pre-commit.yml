name: Prek checks
on: [push, pull_request]
permissions: {}
env:
  SQLX_VERSION: 0.9.1
  SQLX_FEATURES: "rustls,sqlite"
jobs:
  prek:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install sqlite3 -y
      - name: Cache sqlx-cli
        uses: actions/cache@v6.1.0
        id: cache-sqlx
        with:
          path: ~/.cargo/bin/sqlx ~/.cargo/bin/cargo-sqlx
          key: ${{ runner.os }}-sqlx-${{ env.SQLX_VERSION }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit == false
        run: cargo install sqlx-cli --force --version=${{ env.SQLX_VERSION}} --features=${{ env.SQLX_FEATURES}} --no-default-features
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '>=1.18.0'
      - name: Migrate database and check sqlx-data.json is up-to-date
        run: ./scripts/init_db.sh && cargo sqlx prepare --check -- --bin axum-graphql
      - uses: j178/prek-action@v3.1.1
        env:
          SKIP: no-commit-to-branch
