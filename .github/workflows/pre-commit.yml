name: Prek checks
on: [push, pull_request]
permissions: {}
jobs:
  prek:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '>=1.18.0'
      - uses: j178/prek-action@v3.1.1
        env:
          SKIP: no-commit-to-branch
