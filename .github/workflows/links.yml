name: Links
on: [push, pull_request]
permissions: {}
jobs:
  linkChecker:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore lychee cache
        uses: actions/cache@v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: "--cache --max-cache-age 1d --exclude-path \"deny.toml\" . \"**/*.toml\" \"**/*.rs\" \"**/*.yml\""
          fail: true
