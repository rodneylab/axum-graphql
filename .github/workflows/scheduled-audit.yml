name: Security audit
on:
  schedule:
    - cron: '25 23 * * *'
permissions: {}
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@main
        with:
          ignore: RUSTSEC-2023-0071
          token: ${{ secrets.GITHUB_TOKEN }}
